name: Deploy Calculator

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          echo "Current directory:"
          pwd
          echo "Dist contents:"
          ls -la dist

      - name: Show FTP settings
        run: |
          echo "FTP Host: ${{ secrets.FTP_HOST }}"
          echo "FTP User: ${{ secrets.FTP_USERNAME }}"

      - name: Test FTP Port
        run: |
          timeout 10 bash -c '</dev/tcp/${{ secrets.FTP_HOST }}/21' \
          && echo "FTP PORT OPEN" \
          || echo "FTP PORT CLOSED"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/calculators/
          dangerous-clean-slate: false